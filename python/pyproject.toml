[project]
name = "ipydesk"
version = "0.0.8"
description = "MATLAB-style Python desktop for VS Code. Variables and figures stay after the run."
requires-python = ">=3.9"
dependencies = [
    "ipython",
    "ipdb",
    "matplotlib",
    # 既定バックエンドが webagg なので tornado は必須。
    # 任意扱いにしていると pip install ipydesk だけした人の図が出ない。
    "tornado",
]

[project.optional-dependencies]
qt = ["PyQt5"]
web = []   # tornado は必須依存へ移動。既存の手順を壊さないため名前だけ残す

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipydesk*"]

[tool.setuptools.package-data]
ipydesk = ["images/*.png"]